services:
  - type: web
    name: dental-factory
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    disk:
      name: dental-factory-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_SESSION_MINUTES
        value: 30
      - key: ADMIN_ALLOWED_IPS
        sync: false
      - key: ADMIN_ALLOWED_IP_HASHES
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: PAYMENT_CURRENCY
        value: INR
